[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-agent"
version = "0.1.0"
description = "Read-only product discovery contracts and deterministic filters"
requires-python = ">=3.10"

[project.scripts]
muse-selector = "muse_selector.cli:main"
muse-watch = "muse_selector.watch:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
