[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-agent"
version = "0.1.0"
description = "Read-only product discovery contracts and deterministic filters"
requires-python = ">=3.10"

[project.scripts]
muse-selector = "muse_selector.cli:main"
muse-selector-web = "muse_selector.web:main"
muse-state-graph = "muse_selector.state_graph:main"
muse-watch = "muse_selector.watch:main"
muse-live-smoke = "muse_selector.smoke:main"
muse-zhuanzhuan-smoke = "muse_selector.zhuanzhuan_smoke:main"
muse-doctor = "muse_selector.doctor:main"
muse-release-check = "muse_selector.release_check:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
