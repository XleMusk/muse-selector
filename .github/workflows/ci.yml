name: muse-selector-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit and regression tests
        shell: bash
        env:
          PYTHONPATH: "$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE/tests"
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/regression_harness.py
