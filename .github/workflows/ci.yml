name: muse-selector-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: muse-selector-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check engineering rules
        run: |
          python -m pip install --disable-pip-version-check ruff mypy
          ruff check src/muse_selector tests
          mypy
      - name: Verify installable CLI
        run: |
          python -m pip install --no-deps -e .
          muse-selector --help
          muse-selector --version
          muse-selector-web --help
          muse-state-graph --help
          muse-doctor --version
          muse-release-check --help
          muse-release-check --root . > release_check.json
          python -c "import json; p=json.load(open('release_check.json', encoding='utf-8')); assert p['schema_version'] == 'muse.selector.release.v1'; assert p['local_ready'] is True; assert p['go'] is False; assert p['read_only'] is True"
          muse-doctor --fixture tests/fixtures/ebay_hk_sample.json > doctor.json
          python -c "import json; p=json.load(open('doctor.json', encoding='utf-8')); assert p['ok'] is True; assert p['read_only'] is True; assert p['schema_version'] == 'muse.doctor.v1'; assert p['runtime']['package_version']; assert p['runtime']['python_version']; assert p['ebay_target']['environment'] == 'production'; assert p['ebay_target']['api_host'] == 'api.ebay.com'; assert all(c['ok'] for c in p['checks'])"
          muse-selector --query "香港预算 HKD 7000 以内的迷你主机" --fixture tests/fixtures/ebay_hk_sample.json --format json > cli_result.json
          python -c "import json; p=json.load(open('cli_result.json', encoding='utf-8')); assert p['schema_version'] == 'muse.selector.v1'; assert p['ok'] is True; assert p['read_only'] is True; assert p['recommended']; assert all(card.get('evidence_coverage', 0) >= 0.95 for card in p['recommended'])"
          muse-state-graph --query "香港预算 HKD 7000 以内的迷你主机" --fixture tests/fixtures/ebay_hk_sample.json > state_graph.json
          python -c "import json; p=json.load(open('state_graph.json', encoding='utf-8')); assert p['schema_version'] == 'muse.selector.execution.v1'; assert p['status'] == 'complete'; assert p['read_only'] is True; assert p['stages'][-1]['name'] == 'present'; assert p['checkpoint']['payload']['recommended']"
          watch_db="$RUNNER_TEMP/muse-watch.sqlite3"
          muse-watch --db "$watch_db" --query "香港预算 HKD 7000 以内的迷你主机" --fixture tests/fixtures/ebay_hk_sample.json --once > watch_first.json
          muse-watch --db "$watch_db" --query "香港预算 HKD 7000 以内的迷你主机" --fixture tests/fixtures/ebay_hk_sample.json --once > watch_second.json
          python -c "import json; a=json.load(open('watch_first.json', encoding='utf-8')); b=json.load(open('watch_second.json', encoding='utf-8')); assert a['schema_version'] == 'muse.selector.v1'; assert b['schema_version'] == 'muse.selector.v1'; assert a['changed'] is True; assert b['changed'] is False; assert a['run_id'] == b['run_id']"
          set +e
          env -u EBAY_PRODUCTION_CLIENT_ID -u EBAY_PRODUCTION_CLIENT_SECRET -u EBAY_SANDBOX_CLIENT_ID -u EBAY_SANDBOX_CLIENT_SECRET -u EBAY_CLIENT_ID -u EBAY_CLIENT_SECRET muse-live-smoke --query "香港 RTX 4070 显卡，预算 HKD 9000" > live_smoke.json
          smoke_status=$?
          set -e
          test "$smoke_status" -eq 2
          python -c "import json; p=json.load(open('live_smoke.json', encoding='utf-8')); assert p['schema_version'] == 'muse.selector.v1'; assert p['status'] == 'source_unavailable'; assert p['read_only'] is True; assert p['credential_state'] == 'missing'"
          set +e
          env -u EBAY_PRODUCTION_CLIENT_ID -u EBAY_PRODUCTION_CLIENT_SECRET -u EBAY_SANDBOX_CLIENT_ID -u EBAY_SANDBOX_CLIENT_SECRET -u EBAY_CLIENT_ID -u EBAY_CLIENT_SECRET muse-live-smoke --environment sandbox --query "香港 RTX 4070 显卡，预算 HKD 9000" > live_smoke_sandbox.json
          sandbox_smoke_status=$?
          set -e
          test "$sandbox_smoke_status" -eq 2
          python -c "import json; p=json.load(open('live_smoke_sandbox.json', encoding='utf-8')); assert p['schema_version'] == 'muse.selector.v1'; assert p['status'] == 'source_unavailable'; assert p['read_only'] is True; assert p['credential_state'] == 'missing'; assert p['credential_env']['scoped'][0] == 'EBAY_SANDBOX_CLIENT_ID'; assert p['source_metadata']['environment'] == 'sandbox'"
          set +e
          muse-selector --query "国内预算 CNY 8000 以内的二手迷你主机" --format json > domestic_result.json
          domestic_status=$?
          set -e
          test "$domestic_status" -eq 2
          python -c "import json; p=json.load(open('domestic_result.json', encoding='utf-8')); assert p['schema_version'] == 'muse.selector.v1'; assert p['status'] == 'source_unavailable'; assert p['read_only'] is True; assert [x['status'] for x in p['link_only']] == ['link_only', 'link_only']"
          set +e
          env -u ZHUANZHUAN_MCP_TOKEN muse-zhuanzhuan-smoke --query "RTX 4070 显卡" > zhuanzhuan_smoke.json
          zhuan_status=$?
          set -e
          test "$zhuan_status" -eq 2
          python -c "import json; p=json.load(open('zhuanzhuan_smoke.json', encoding='utf-8')); assert p['schema_version'] == 'muse.zhuanzhuan.smoke.v1'; assert p['status'] == 'source_unavailable'; assert p['read_only'] is True"
      - name: Verify local web runtime
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          web_log="$RUNNER_TEMP/muse-web.log"
          muse-selector-web --fixture tests/fixtures/ebay_hk_sample.json --host 127.0.0.1 --port 8765 >"$web_log" 2>&1 &
          web_pid=$!
          cleanup() {
            kill "$web_pid" 2>/dev/null || true
            wait "$web_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          python - <<'PY'
          import json
          import time
          from urllib.parse import urlencode
          from urllib.request import urlopen

          base = "http://127.0.0.1:8765"
          last_error = None
          for _ in range(20):
              try:
                  with urlopen(base + "/healthz", timeout=1) as response:
                      health = json.load(response)
                  assert health["ok"] is True
                  assert health["read_only"] is True
                  assert health["schema_version"] == "muse.selector.v1"
                  query = urlencode({"q": "香港预算 HKD 7000 以内的迷你主机", "limit": 1})
                  with urlopen(base + "/api/search?" + query, timeout=2) as response:
                      payload = json.load(response)
                  assert payload["ok"] is True
                  assert payload["read_only"] is True
                  assert payload["schema_version"] == "muse.selector.v1"
                  assert payload["recommended"]
                  print("web_runtime_ok", len(payload["recommended"]))
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(0.25)
          else:
              raise SystemExit(f"local web runtime did not become ready: {last_error}")
          PY
      - name: Run unit and regression tests
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/regression_harness.py
          python tests/fault_harness.py > fault_result.json
          python -c "import json; p=json.load(open('fault_result.json', encoding='utf-8')); assert p['schema_version'] == 'muse.selector.faults.v1'; assert p['ok'] is True; assert p['read_only'] is True; assert not p['failed_cases']"
          python tests/metrics_harness.py > metrics_result.json
          python -c "import json; p=json.load(open('metrics_result.json', encoding='utf-8')); assert p['schema_version'] == 'muse.selector.metrics.v1'; assert p['ok'] is True; assert p['read_only'] is True; assert p['failure_count'] == 0; assert p['hard_constraint_violation_rate'] == 0.0; assert p['replay_mismatch_count'] == 0; assert p['cost_proxy']['external_requests'] == 0"
