name: muse-selector-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify installable CLI
        run: |
          python -m pip install --no-deps -e .
          muse-selector --help
          muse-selector --query "香港预算 HKD 7000 以内的迷你主机" --fixture tests/fixtures/ebay_hk_sample.json --format json > cli_result.json
          python -c "import json; p=json.load(open('cli_result.json', encoding='utf-8')); assert p['ok'] is True; assert p['read_only'] is True; assert p['recommended']"
          set +e
          env -u EBAY_CLIENT_ID -u EBAY_CLIENT_SECRET muse-live-smoke --query "香港 RTX 4070 显卡，预算 HKD 9000" > live_smoke.json
          smoke_status=$?
          set -e
          test "$smoke_status" -eq 2
          python -c "import json; p=json.load(open('live_smoke.json', encoding='utf-8')); assert p['status'] == 'source_unavailable'; assert p['read_only'] is True; assert p['credential_state'] == 'missing'"
      - name: Run unit and regression tests
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tests/regression_harness.py
