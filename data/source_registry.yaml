sources:
  - source_id: ebay.browse.hk.v1
    display_name: eBay Browse API (Hong Kong marketplace)
    category: computers_hardware
    access_mode: official_api
    endpoint: https://api.ebay.com/buy/browse/v1/item_summary/search
    marketplace_id: EBAY_HK
    delivery_country: HK
    read_only: true
    writes_enabled: false
    authentication: oauth2_client_credentials_application_token
    authorization_evidence_url: https://developer.ebay.com/api-docs/buy/api-browse.html
    terms_url: https://developer.ebay.com/devzone/license-agreement/api_license_agreement.pdf
    allowed_fields: [title, url, price, condition, stock, shipping, seller, localizedAspects]
    write_actions: []
    credentials_from_environment:
      - EBAY_PRODUCTION_CLIENT_ID
      - EBAY_PRODUCTION_CLIENT_SECRET
      - EBAY_SANDBOX_CLIENT_ID
      - EBAY_SANDBOX_CLIENT_SECRET
      - EBAY_CLIENT_ID
      - EBAY_CLIENT_SECRET
    environments: [sandbox, production]
    production_access_status: partner_approval_pending
    default_policy: allow_read_only
    retention_days: 30
    cache_ttl_minutes: 15
    kill_switch: source_ebay_browse_hk
    notes: >-
      Search-only adapter. Browse API production use is subject to eBay Buy
      API production access approval, Partner Network terms, and the current
      API License Agreement.

  - source_id: xianyu.partner.v1
    display_name: 闲鱼官方合作方能力（待搜索权限）
    category: computers_hardware
    access_mode: official_partner_api
    region: CN
    currency: CNY
    read_only: true
    writes_enabled: false
    listing_search: false
    status: partner_api_pending
    authentication: appkey_oauth_user_authorization
    authorization_evidence_url: https://open.goofish.com/doc/development/dev/server.html
    allowed_fields: [title, url, price, condition, stock, seller, specs]
    write_actions: []
    default_policy: link_only
    kill_switch: source_xianyu_partner
    notes: >-
      Public partner documentation covers approved mini-program/partner
      capabilities and service-provider-owned item queries. No general
      arbitrary-listing search permission is registered for this project.

  - source_id: zhuanzhuan.recommerce.mcp.v1
    display_name: 转转官方 MCP 回收估价
    category: computers_hardware
    access_mode: official_mcp
    region: CN
    currency: CNY
    read_only: true
    writes_enabled: false
    listing_search: false
    capabilities: [recycle_valuation, open_recycle_entry]
    authentication: bearer_token_after_phone_verification
    authorization_evidence_url: https://open.zhuanzhuan.com/mcp
    allowed_fields: [product, model, confidence, price_range, warnings, handoff_url]
    write_actions: []
    default_policy: allow_read_only
    kill_switch: source_zhuanzhuan_recommerce_mcp
    notes: >-
      Official MCP is an auxiliary valuation/entry source. It does not
      provide a general marketplace listing search endpoint.

  - source_id: game_accounts.policy.v1
    display_name: 游戏账号只读策略域
    category: game_accounts
    access_mode: user_link
    read_only: true
    writes_enabled: false
    listing_search: false
    status: link_only
    allowed_regions: [CN, HK]
    allowed_fields: [policy_status, blocked_actions]
    write_actions: []
    default_policy: allow_read_only
    link_only: true
    notes: >-
      This domain exposes policy metadata only. It does not search listings,
      collect credentials, open account-transfer flows, or execute purchases,
      transfers, boosting, or payments.

  - source_id: game_accounts.5173.link.v1
